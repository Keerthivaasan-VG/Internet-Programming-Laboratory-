<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Shopping System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fa;
            margin: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px 40px;
            border: 1px solid #dcdcdc;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        h1 {
            color: #1e3a5f;
            text-align: center;
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 26px;
        }
        h2 {
            color: #2c3e50;
            font-size: 18px;
            margin-top: 30px;
            margin-bottom: 12px;
            text-align: center;
        }
        h3 {
            color: #2c3e50;
            font-size: 16px;
            margin-top: 25px;
            margin-bottom: 12px;
        }
        .section-center {
            text-align: center;
            margin-bottom: 25px;
        }
        .banner-img, .product-img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .banner-img {
            max-width: 500px;
        }
        .product-img {
            max-width: 120px;
        }
        .product-card {
            border: 1px solid #e0e0e0;
            padding: 15px;
            text-align: center;
            max-width: 250px;
            margin: 0 auto 20px auto;
            background: #fafafa;
            border-radius: 4px;
        }
        .drag-box {
            border: 2px dashed #999;
            background: #fff;
            padding: 12px;
            text-align: center;
            color: #555;
            margin-bottom: 20px;
            font-size: 14px;
            border-radius: 4px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: inline-block;
            width: 90px;
            font-size: 14px;
            font-weight: 500;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            max-width: 350px;
            padding: 7px 10px;
            border: 1px solid #aaa;
            border-radius: 3px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .radio-group label {
            width: auto;
            font-weight: normal;
            margin-right: 15px;
            cursor: pointer;
        }
        textarea {
            max-width: 350px;
            height: 70px;
            resize: vertical;
            vertical-align: top;
        }
        .btn-group {
            margin-top: 20px;
            margin-left: 95px;
        }
        button, input[type="reset"], input[type="submit"] {
            padding: 7px 16px;
            border: 1px solid #777;
            border-radius: 3px;
            background-color: #e9ecef;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }
        button:hover, input[type="reset"]:hover, input[type="submit"]:hover {
            background-color: #dde0e3;
        }
        audio, video {
            width: 100%;
            max-width: 400px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Online Shopping System</h1>
    <div class="section-center">
        <h2 style="margin-top:0;">Product Categories</h2>
        <img src="https://images.unsplash.com/photo-1555529771-835f59fc5efe?auto=format&fit=crop&w=600&q=80" alt="Tech Hub Storefront" class="banner-img">
    </div>

    <h3>Products</h3>
    <div class="product-card">
        <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=300&q=80" alt="Mobile Phone" class="product-img">
        <p style="font-weight: bold; margin: 10px 0 5px 0;">Mobile Phone</p>
        <p style="color: #444; margin: 0 0 12px 0; font-size: 14px;">Price: Rs. 20,000</p>
        <div class="drag-box" draggable="true">Drag Mobile to Cart</div>
    </div>

    <div class="form-group">
        <label>Shopping Cart</label>
        <div class="drag-box" style="display: inline-block; width: 350px; margin-bottom: 0;">Drop Mobile to Cart Here</div>
    </div>

    <div class="form-group">
        <label>Store Location</label>
        <button type="button">Get My Location</button>
    </div>

    <div class="form-group">
        <label>Store Audio</label>
        <audio controls>
            <source src="#" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>

    <div class="section-center">
        <h3>Product Video</h3>
        <video controls>
            <source src="#" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <div class="section-center" style="margin-top: 15px;">
        <img src="https://images.unsplash.com/photo-1555529771-835f59fc5efe?auto=format&fit=crop&w=600&q=80" alt="Storefront View" class="banner-img" style="max-width: 450px;">
    </div>

    <h2 style="text-align: left;">Purchase Form</h2>
    <form action="#" method="post">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required>
        </div>

        <div class="form-group">
            <label for="product">Product:</label>
            <select id="product" name="product">
                <option value="mobile">Mobile Phone</option>
            </select>
        </div>

        <div class="form-group">
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" min="1" value="1">
        </div>

        <div class="form-group">
            <label for="date">Date:</label>
            <input type="date" id="date" name="date">
        </div>

        <div class="form-group">
            <label>Payment:</label>
            <div class="radio-group" style="display: inline-block;">
                <label><input type="radio" name="payment" value="UPI"> UPI</label>
                <label><input type="radio" name="payment" value="Card"> Card</label>
                <label><input type="radio" name="payment" value="Cash"> Cash</label>
            </div>
        </div>

        <div class="form-group">
            <label for="address">Address:</label>
            <textarea id="address" name="address"></textarea>
        </div>

        <div class="btn-group">
            <input type="submit" value="Buy Now">
            <input type="reset" value="Clear">
        </div>
    </form>
</div>

</body>
</html>
